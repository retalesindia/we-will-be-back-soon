<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<meta name="description" content="We'll be back soon.">
<title>We'll Be Back Soon</title>
<style>
  :root {
    --bg: #070707;
    --text: #f5f5f5;
    --muted: #8d8d8d;
    --line: rgba(255,255,255,.11);
    --accent: #a855f7;
    --accent-2: #6d28d9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    min-height: 100%;
    background: var(--bg);
  }

  body {
    min-height: 100svh;
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  .noise {
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    opacity: .035;
    pointer-events: none;
    z-index: 5;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    animation: noise .18s steps(2) infinite;
  }

  .aurora {
    position: fixed;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168,85,247,.18) 0%, rgba(109,40,217,.08) 32%, transparent 68%);
    filter: blur(30px);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: breathe 7s ease-in-out infinite;
    pointer-events: none;
  }

  .orb {
    position: fixed;
    width: 18vmax;
    height: 18vmax;
    min-width: 180px;
    min-height: 180px;
    border-radius: 50%;
    border: 1px solid rgba(168,85,247,.16);
    box-shadow:
      0 0 80px rgba(168,85,247,.10),
      inset 0 0 70px rgba(168,85,247,.06);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: orb 12s linear infinite;
    pointer-events: none;
  }

  .orb::before,
  .orb::after {
    content: "";
    position: absolute;
    inset: 12%;
    border-radius: inherit;
    border: 1px solid rgba(255,255,255,.06);
  }

  .orb::after {
    inset: 25%;
    border-color: rgba(168,85,247,.10);
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #fff;
    opacity: .35;
    animation: twinkle var(--d) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  .page {
    position: relative;
    z-index: 10;
    width: min(940px, 92vw);
    text-align: center;
    padding: 48px 20px;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255,255,255,.035);
    backdrop-filter: blur(12px);
    color: #b8b8b8;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(15px);
    animation: reveal .9s .15s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(168,85,247,.5);
    animation: pulse 2s infinite;
  }

  h1 {
    margin-top: 28px;
    font-size: clamp(58px, 10vw, 132px);
    line-height: .88;
    letter-spacing: -.075em;
    font-weight: 750;
    text-wrap: balance;
    opacity: 0;
    transform: translateY(30px);
    animation: reveal 1.1s .3s cubic-bezier(.2,.8,.2,1) forwards;
  }

  h1 span {
    display: block;
    background: linear-gradient(110deg, #fff 20%, #c4c4c4 45%, #a855f7 72%, #fff 90%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }

  .sub {
    max-width: 560px;
    margin: 30px auto 0;
    color: var(--muted);
    font-size: clamp(15px, 2vw, 18px);
    line-height: 1.7;
    opacity: 0;
    transform: translateY(20px);
    animation: reveal .9s .55s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .actions {
    margin-top: 34px;
    display: flex;
    justify-content: center;
    gap: 12px;
    opacity: 0;
    transform: translateY(15px);
    animation: reveal .9s .7s cubic-bezier(.2,.8,.2,1) forwards;
  }

  button {
    appearance: none;
    border: 1px solid rgba(255,255,255,.15);
    color: #fff;
    background: rgba(255,255,255,.055);
    padding: 13px 19px;
    border-radius: 10px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    transition: transform .25s ease, background .25s ease, border-color .25s ease;
    backdrop-filter: blur(10px);
  }

  button:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.10);
    border-color: rgba(168,85,247,.45);
  }

  .footer {
    position: fixed;
    z-index: 10;
    left: 0;
    right: 0;
    bottom: 25px;
    text-align: center;
    color: #555;
    font-size: 11px;
    letter-spacing: .08em;
    opacity: 0;
    animation: reveal .8s 1s forwards;
  }

  .footer::before {
    content: "";
    display: block;
    width: 46px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #444, transparent);
    margin: 0 auto 12px;
  }

  .corner {
    position: fixed;
    width: 34px;
    height: 34px;
    border-color: rgba(255,255,255,.12);
    pointer-events: none;
  }

  .tl { top: 24px; left: 24px; border-top: 1px solid; border-left: 1px solid; }
  .tr { top: 24px; right: 24px; border-top: 1px solid; border-right: 1px solid; }
  .bl { bottom: 24px; left: 24px; border-bottom: 1px solid; border-left: 1px solid; }
  .br { bottom: 24px; right: 24px; border-bottom: 1px solid; border-right: 1px solid; }

  @keyframes reveal {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes breathe {
    0%,100% { transform: translate(-50%,-50%) scale(.9); opacity: .7; }
    50% { transform: translate(-50%,-50%) scale(1.12); opacity: 1; }
  }

  @keyframes orb {
    from { transform: translate(-50%,-50%) rotate(0deg) scale(.95); }
    50% { transform: translate(-50%,-50%) rotate(180deg) scale(1.05); }
    to { transform: translate(-50%,-50%) rotate(360deg) scale(.95); }
  }

  @keyframes shine {
    to { background-position: -220% center; }
  }

  @keyframes pulse {
    70% { box-shadow: 0 0 0 7px rgba(168,85,247,0); }
    100% { box-shadow: 0 0 0 0 rgba(168,85,247,0); }
  }

  @keyframes twinkle {
    0%,100% { opacity: .12; transform: scale(.7); }
    50% { opacity: .65; transform: scale(1.3); }
  }

  @keyframes noise {
    0% { transform: translate(0,0); }
    25% { transform: translate(2%,-1%); }
    50% { transform: translate(-1%,2%); }
    75% { transform: translate(1%,1%); }
    100% { transform: translate(-2%,-1%); }
  }

  @media (max-width: 600px) {
    .page { padding: 35px 15px 70px; }
    h1 { font-size: clamp(54px, 17vw, 90px); }
    .sub { font-size: 14px; }
    .corner { width: 22px; height: 22px; }
    .tl,.tr { top: 15px; }
    .bl,.br { bottom: 15px; }
    .tl,.bl { left: 15px; }
    .tr,.br { right: 15px; }
    .footer { bottom: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<div class="noise"></div>
<div class="aurora"></div>
<div class="orb"></div>
<div class="stars" id="stars"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<main class="page">
  <div class="status">
    <span class="pulse"></span>
    Temporary downtime
  </div>

  <h1>
    <span>We'll be</span>
    <span>back soon.</span>
  </h1>

  <p class="sub">
    We’re making a few changes behind the scenes.
    Something better is on its way - thank you for your patience.
  </p>

  <div class="actions">
    <button onclick="location.reload()">Check again</button>
  </div>
</main>

<div class="footer">PLEASE CHECK BACK SHORTLY</div>

<script>
  const stars = document.getElementById("stars");
  const count = Math.min(90, Math.floor(innerWidth * innerHeight / 14000));

  for (let i = 0; i < count; i++) {
    const s = document.createElement("i");
    s.className = "star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.setProperty("--d", (2 + Math.random() * 5) + "s");
    s.style.setProperty("--delay", (-Math.random() * 6) + "s");
    stars.appendChild(s);
  }

  // Gentle parallax on desktop.
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    addEventListener("pointermove", e => {
      const x = (e.clientX / innerWidth - .5);
      const y = (e.clientY / innerHeight - .5);
      document.querySelector(".aurora").style.marginLeft = `${x * 22}px`;
      document.querySelector(".aurora").style.marginTop = `${y * 22}px`;
      document.querySelector(".orb").style.marginLeft = `${x * 10}px`;
      document.querySelector(".orb").style.marginTop = `${y * 10}px`;
    });
  }
</script>
</body>
</html>
